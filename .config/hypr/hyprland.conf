bind=$mod,H,movefocus,l
bind=$mod,L,movefocus,r
bind=$mod,K,movefocus,u
bind=$mod,J,movefocus,d

# example binds
bind=$mod,RETURN,exec,kitty
bind=$mod,Q,killactive,
bind=$mod,C,exec,hyprpicker -a
# bind=$mod,M,exit,
bind=$mod,E,exec,pcmanfm
bind=$mod,V,togglefloating,
bind=$mod,P,exec,wofi --show drun -o DP-1
# bind=$mod,R,pseudo,
bind=$mod,F,fullscreen
binde=$mod,Up,exec,~/.local/bin/volume up
binde=$mod,Down,exec,~/.local/bin/volume down
# bind = $mod, SPACE, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

bind=$modALT,SPACE,exec,playerctl play-pause
bind=$mod,LEFT,exec,playerctl previous
bind=$mod,RIGHT,exec,playerctl next
bind=$modSHIFT,S,exec,grimblast copy area
bind=$mod,PRINT,exec,grimblast copy output
bind=$modALT,L,exec,hyprlock

bind=$mod,1,workspace,1
bind=$mod,2,workspace,2
bind=$mod,3,workspace,3
bind=$mod,4,workspace,4
bind=$mod,5,workspace,5
bind=$mod,6,workspace,6
bind=$mod,7,workspace,7
bind=$mod,8,workspace,8
bind=$mod,9,workspace,9
bind=$mod,0,workspace,10

bind=ALT,1,movetoworkspace,1
bind=ALT,2,movetoworkspace,2
bind=ALT,3,movetoworkspace,3
bind=ALT,4,movetoworkspace,4
bind=ALT,5,movetoworkspace,5
bind=ALT,6,movetoworkspace,6
bind=ALT,7,movetoworkspace,7
bind=ALT,8,movetoworkspace,8
bind=ALT,9,movetoworkspace,9
bind=ALT,0,movetoworkspace,10

bindm=$mod,mouse:272,movewindow
bindm=$mod,mouse:273,resizewindow

